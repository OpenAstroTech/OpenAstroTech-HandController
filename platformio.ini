; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rpi2040

[env:rpi2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = adafruit_feather_usb_host
board_build.f_cpu = 120000000L
monitor_speed = 19200


lib_deps = 
  https://github.com/sekigon-gonnoc/Pico-PIO-USB
  https://github.com/ClutchplateDude/esp8266-oled-ssd1306
  
build_flags =
  -DUSE_TINYUSB
  -D__STDC_LIMIT_MACROS
  -D__STDC_CONSTANT_MACROS
  -DCFG_TUD_ENABLED=1

; Host-side unit tests for the pure logic (Serial.cpp, MessageJob.cpp,
; Joystick.hpp, ...). main.cpp/SerialUSBHost.cpp/MenuSystem.cpp depend on
; hardware libraries and are excluded. test/support provides an Arduino.h
; test double built around the real ArduinoCore-API String.
[env:native]
platform = native
test_build_src = true
build_flags =
  -std=gnu++11
  -DHOST
  -DDEBUG_LEVEL=0
  -DINFO_DISPLAY=0
  -Itest/support
build_src_filter =
  +<*>
  -<main.cpp>
  -<SerialUSBHost.cpp>
  -<MenuSystem.cpp>

